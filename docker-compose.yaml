services:
  bosun:
    build: .
    image: bosun:latest
    container_name: bosun
    restart: unless-stopped
    environment:
      - NODE_NAME=${NODE_NAME:-server-a}
      - RQLITE_JOIN=${RQLITE_JOIN:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Both are required; generate with: openssl rand -base64 48
      - MASTER_KEY=${MASTER_KEY:?set MASTER_KEY}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET}
      - WS_PORT=3002
      - APP_URL=${APP_URL:-http://localhost:3042}
    volumes:
      - bosun-data:/data/rqlite
    ports:
      - "${BOSUN_PORT:-3042}:3042"
    networks:
      - bosun-net

volumes:
  bosun-data:
    driver: local

networks:
  bosun-net:
    driver: bridge
