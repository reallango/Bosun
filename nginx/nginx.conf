events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 3042;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # X-Bosun-Peer is the address that opened the connection. It is always
    # overwritten here, so a client cannot forge it. The app reads
    # X-Forwarded-For (passed through unchanged) only when this peer is listed
    # in TRUSTED_PROXIES; see src/lib/net/client-ip.js.

    location ^~ /ws/ {
      proxy_pass http://127.0.0.1:3002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Bosun-Peer $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Bosun-Peer $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
