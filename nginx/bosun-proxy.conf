# Example reverse proxy in front of Bosun. It forwards to Bosun's published
# port (3042), never to the internal ports 3000/3002: the nginx inside the
# container is what records the connecting address (X-Bosun-Peer).
#
# For login rate limits and audit entries to see real client addresses, add
# this proxy's address (as Bosun sees it, e.g. its Docker network subnet) to
# Bosun's TRUSTED_PROXIES, e.g. TRUSTED_PROXIES=172.18.0.0/16.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;

  # Long-lived session support
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # WebSocket route
  location ^~ /ws/ {
    proxy_pass http://bosun:3042;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # App route
  location / {
    proxy_pass http://bosun:3042;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
