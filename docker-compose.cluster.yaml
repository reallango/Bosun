# One Bosun node of a cluster. Run this file on each machine. Either join the
# nodes from the UI (setup page > Join an existing cluster; no variables
# needed), or configure them with an .env (see README "Clustering"):
#
#   NODE_NAME=n1                      # n2, n3 on the other machines
#   RQLITE_ADV_HOST=192.168.1.161     # this machine's LAN address
#   RQLITE_JOIN=192.168.1.161:4002,192.168.1.131:4002,192.168.1.171:4002
#   (MASTER_KEY/AUTH_SECRET: leave unset on nodes that join with a join code;
#    if you set them, they must be identical on every node)
#
# Ports 4001 (rqlite HTTP) and 4002 (Raft) must be reachable between the
# nodes; keep them off the internet (firewall them to the cluster machines).
services:
  bosun:
    build: .
    image: bosun:latest
    container_name: bosun
    restart: unless-stopped
    environment:
      - NODE_NAME=${NODE_NAME:-}
      - RQLITE_ADV_HOST=${RQLITE_ADV_HOST:-}
      - RQLITE_JOIN=${RQLITE_JOIN:-}
      - RQLITE_BOOTSTRAP_EXPECT=${RQLITE_BOOTSTRAP_EXPECT:-3}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Optional: if unset, Bosun generates both and keeps them in the data volume.
      - MASTER_KEY=${MASTER_KEY:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - WS_PORT=3002
      - APP_URL=${APP_URL:-http://localhost:3042}
      # Disaster recovery only (see README): - RQLITE_FORCE_SINGLE=1
    volumes:
      - bosun-data:/data/rqlite
    ports:
      - "${BOSUN_PORT:-3042}:3042"
      - "4001:4001"
      - "4002:4002"
    networks:
      - bosun-net

volumes:
  bosun-data:
    driver: local

# BOSUN_NETWORK picks the network by name (default: bosun-net). Set
# BOSUN_NETWORK_EXTERNAL=true to attach to a network that already exists
# (e.g. one created in Portainer) instead of creating it with the stack.
networks:
  bosun-net:
    name: ${BOSUN_NETWORK:-bosun-net}
    external: ${BOSUN_NETWORK_EXTERNAL:-false}
